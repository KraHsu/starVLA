# LCLGP v5 — explicit MoE-style routing (C1+C2+C3).
#
# v2/v3/v4 (1-2/7 to 4/7 best) hit a structural ceiling: training-time
# softmin(per_mode_loss) gives 4 modes ~uniform pi_bar (l_bal satisfied),
# but hindsight argmin always picks one winner (cov_end k=99-100%).
# Hparam tuning across v2/v3/v4 cannot break this soft/hard mismatch —
# it's a property of the L_bal+min-of-K+L_ctr loss family. See docs §9.4.
#
# v5 architectural rewrite (architecture and 5 losses preserved in COUNT,
# but routing source replaced):
#   - NEW RoutingModule (text + z_t → pi_end, pi_delta), no GT used
#   - Routing via Gumbel-softmax (hard one-hot forward + soft STE backward)
#   - L_recon, L_ctr, L_cf all use router-chosen mode (replaces argmin best)
#   - L_bal = KL(pi_hard.mean(0) || Uniform); two heads (end/delta)
#   - L_repulsive unchanged (still pushes mode outputs apart in latent space)
#   - sigma freed from routing duty; remains as calibrated NLL uncertainty
#
# Two routers (separate K-heads, shared backbone) — user-decided. End and
# delta can route to different modes for the same task; "mode k" no longer
# requires cross-timescale coherence. Backbone shared for parameter economy
# (~50 extra params).
#
# Router warmup (first 500 steps): deterministic uniform routing
# `pi_hard[b, k] = 1 if k == b % K else 0`. Guarantees all K mode heads
# receive recon gradient before router takes over → prevents winner-takes-all
# snowball at L_recon level (Plan agent fix).
#
# Backward compat: framework.lclgp.use_router defaults False (v4 behavior).
# v1-v4 yamls unchanged.
#
# Diagnostic threshold redefinition: D1-b (legacy hindsight argmin freq)
# replaced by D1-d (router output freq) for v5 success criterion. Original
# D1-b kept as informational. See docs/lclgp_diagnostics.md §10.
#
# Hard cutoff: v5 ≤ 4/7 → fall back to option B (v2 plan-prior). No v6.

data:
  lclgp_dataset:
    output_dir: data/lclgp_dataset/pav_libero
    index_train: data/lclgp_dataset/pav_libero/index_train.parquet
    index_val:   data/lclgp_dataset/pav_libero/index_val.parquet
    index_test:  data/lclgp_dataset/pav_libero/index_test.parquet
    text_emb:    data/lclgp_dataset/pav_libero/text_emb.h5
    latent_root: data/latents/pav_libero
    view: primary

  triplet:
    samples_per_demo: 10
    delta_steps: 50

  text_encoder:
    name: qwen3_vl_4b
    path: playground/Pretrained_models/Qwen3-VL-4B-Instruct
    hidden_size: 2560
    dtype: bf16

  vjepa:
    n_tokens: 256
    hidden_size: 1408

  sampler:
    n_tasks: 32
    n_demos: 8
    seed: 0

framework:
  name: LCLGP
  lclgp:
    d_text: 2560
    d_latent: 1408
    d_hidden: 1024
    n_heads: 16
    n_layers: 4
    n_modes: 4
    n_tokens: 256
    z_dropout: 0.1
    attn_dropout: 0.1
    mlp_ratio: 4.0

    # v5: explicit MoE routing (C1+C2+C3)
    use_router: true                      # default false → v4 behavior; true → v5 path
    gumbel_temperature_init: 5.0          # initial Gumbel-softmax temperature (high → exploratory)
    gumbel_temperature_min: 0.5           # final temperature (low → near-discrete routing)
    router_warmup_steps: 500              # uniform routing for first N steps; then router takes over

    loss:
      alpha: 0.5
      beta: 0.5
      lambda_bal: 0.3                     # KL(pi_bar || Uniform) — no softmin shim in v5
      lambda_ctr: 0.1
      lambda_cf: 0.05
      lambda_rep: 0.03                    # mode-output repulsion (kept from v4)
      lambda_rep_warmup_steps: 1200       # kept from v4
      tau: 0.07
      cf_margin: 0.05
      log_sigma_min: -5.0
      log_sigma_max: 1.5
      # bal_temperature/bal_temperature_min unused in v5 path (gumbel temperature replaces)
      bal_temperature: 1.0
      bal_temperature_min: 1.0

trainer:
  max_train_steps: 4800
  num_warmup_steps: 400
  logging_frequency: 20
  save_interval: 800
  num_workers: 4

  learning_rate:
    base: 5.0e-4
  lr_scheduler_type: cosine
  scheduler_specific_kwargs: {}
  optimizer:
    betas: [0.9, 0.999]
    weight_decay: 0.05
    eps: 1.0e-8
  gradient_clipping: 1.0

  loss_scale:
    vla: 1.0

  save_format: pt
  freeze_modules: ""
  pretrained_checkpoint: null
  reload_modules: null
  is_resume: false

seed: 0
is_debug: false
run_root_dir: ./playground/Checkpoints
run_id: pav_w3_lclgp_v5
output_dir: null
wandb_project: pav-w3-lclgp
wandb_entity: null
