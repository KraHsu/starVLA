# LCLGP v1 — data section.
#
# T-W2 deliverable. Only the `data:` block is final; model/training/optimizer
# fields land with W3 (T-W3.3.1). The W3 trainer reads:
#   - data.lclgp_dataset.* to build LcLgpTripletDataset / TaskGroupedSampler
#   - data.text_encoder.hidden_size for LCLGP's d_text projection
#
# Note on d_text: research_design_plan_and_verify.md §5.2 lists d_text=2048
# (Qwen2.5-VL-3B figure). starVLA-PI deploys Qwen3-VL-4B-Instruct whose text
# tower is 2560-dim — this config sets the LCLGP input projection accordingly.

data:
  lclgp_dataset:
    # Output of scripts/build_lclgp_dataset.py
    output_dir: data/lclgp_dataset/pav_libero
    index_train: data/lclgp_dataset/pav_libero/index_train.parquet
    index_val:   data/lclgp_dataset/pav_libero/index_val.parquet
    index_test:  data/lclgp_dataset/pav_libero/index_test.parquet
    text_emb:    data/lclgp_dataset/pav_libero/text_emb.h5
    latent_root: data/latents/pav_libero
    view: primary           # primary | wrist

  triplet:
    samples_per_demo: 10
    delta_steps: 50         # = 1 chunk (H=50)

  text_encoder:
    name: qwen3_vl_4b
    path: playground/Pretrained_models/Qwen3-VL-4B-Instruct
    hidden_size: 2560       # ← Qwen3-VL-4B text_config.hidden_size; design doc said 2048 (Qwen2.5)
    dtype: bf16

  vjepa:
    n_tokens: 256           # 16x16 patches at img_size=256, patch_size=16
    hidden_size: 1408       # V-JEPA 2 ViT-g

  sampler:
    n_tasks: 32
    n_demos: 8              # batch_size = n_tasks * n_demos = 256
    seed: 0

# ---------------------------------------------------------------------------
# Framework — W3.1 deliverable. See research_design_plan_and_verify.md §5.2.
# ---------------------------------------------------------------------------
framework:
  name: LCLGP
  lclgp:
    # Architecture (d_text/d_latent must match data.* above).
    d_text: 2560
    d_latent: 1408
    d_hidden: 1024
    n_heads: 16
    n_layers: 4
    n_modes: 4              # K — multimodal candidate goals
    n_tokens: 256
    z_dropout: 0.1          # D2 regularizer: zero z_t with this probability
    attn_dropout: 0.1
    mlp_ratio: 4.0

    loss:
      alpha: 0.5            # end vs delta timescale weight (eq.5.3.4)
      beta: 0.1             # heteroscedastic log_sigma regularization
      lambda_bal: 0.05      # mode-balance KL weight
      lambda_ctr: 0.1       # InfoNCE weight
      lambda_cf: 0.05       # counterfactual hinge weight
      tau: 0.07             # InfoNCE temperature
      cf_margin: 0.05       # counterfactual hinge margin
      log_sigma_min: -5.0
      log_sigma_max: 5.0
      bal_temperature: 1.0  # softmin temp for differentiable mode KL

# ---------------------------------------------------------------------------
# Trainer — W3.3 deliverable. See research_design_plan_and_verify.md §5.5.
# ---------------------------------------------------------------------------
trainer:
  # Loop control. ~20K samples, batch 256, ~80 steps/epoch → 30 epochs ≈ 2400 steps.
  max_train_steps: 2400
  num_warmup_steps: 200
  logging_frequency: 20
  save_interval: 400
  num_workers: 4

  # Optimizer (AdamW); LR ramps base=5e-4 → 1e-5 cosine over the run.
  learning_rate:
    base: 5.0e-4
  lr_scheduler_type: cosine
  scheduler_specific_kwargs: {}
  optimizer:
    betas: [0.9, 0.999]
    weight_decay: 0.05
    eps: 1.0e-8
  gradient_clipping: 1.0

  # Loss tag scaling (unused by LCLGP but kept for trainer-utils compat).
  loss_scale:
    vla: 1.0

  # Checkpoint + freeze + resume controls.
  save_format: pt           # "pt" or "safetensors"
  freeze_modules: ""        # LCLGP is fully trainable
  pretrained_checkpoint: null
  reload_modules: null
  is_resume: false

# ---------------------------------------------------------------------------
# Top-level run identifiers (overridable by --run_id / --run_root_dir).
# ---------------------------------------------------------------------------
seed: 0
is_debug: false
run_root_dir: ./playground/Checkpoints
run_id: pav_w3_lclgp_v1
output_dir: null            # filled by setup_directories(): ${run_root_dir}/${run_id}
wandb_project: pav-w3-lclgp
wandb_entity: null          # set per-user (or via --wandb_entity)
