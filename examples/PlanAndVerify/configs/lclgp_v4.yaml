# LCLGP v4 — path B 调缓: λ_rep schedule + softer bal_T floor.
#
# v3 (λ_rep=0.1, bal_T_min=0.1) regressed from 4/7 → 2/7 (docs §8):
#   - D1-a 0.882 → 0.149 (overshot target [0.3, 0.7] to near-orthogonal)
#   - D1-c Pearson(σ, err) +0.747 → −0.818 (sign flip — σ-head decalibrated)
#   - G1_end_sigma_cos 0.769 → 0.317 (near random 1/K=0.25)
# Mode collapse persisted (cov_end k1=99.9%; just rotated from v2's k2=99.6%).
# Mechanism: λ_rep=0.1 too strong + repulsive shares backbone with σ-head;
# bal_T sharpened to 0.1 stacked on a 4-orthogonal output config strengthened
# winner-takes-all rather than balanced routing.
#
# Diff from v3:
#   - lambda_rep:                  0.1 → 0.03    (1/3.3× peak repulsion)
#   - lambda_rep_warmup_steps:     0   → 1200    (NEW; off for first 25% of training,
#                                                  then linear ramp 0 → λ_rep over 3600 step;
#                                                  σ-head gets to stabilize before repulsive turns on)
#   - bal_temperature_min:         0.1 → 0.3     (softer floor; less winner-take-all sharpening)
# All other v3 changes (orthogonal slot init, raw-L1 mode-balance input, σ cap=1.5,
# β=0.5, λ_bal=0.3, 4800 steps / 400 warmup) carried over from v2/v3.
#
# Code-side change in lclgp.py: __init__ reads lambda_rep_warmup_steps;
# forward computes current_lambda_rep from training_step (constant=v3
# behavior when warmup_steps=0); contribution to total uses scheduled value;
# new W&B field bal_temperature_current already exists, add lambda_rep_current.
#
# Architecture / data / 5-loss core / σ heads / α=0.5 unchanged.

data:
  lclgp_dataset:
    output_dir: data/lclgp_dataset/pav_libero
    index_train: data/lclgp_dataset/pav_libero/index_train.parquet
    index_val:   data/lclgp_dataset/pav_libero/index_val.parquet
    index_test:  data/lclgp_dataset/pav_libero/index_test.parquet
    text_emb:    data/lclgp_dataset/pav_libero/text_emb.h5
    latent_root: data/latents/pav_libero
    view: primary

  triplet:
    samples_per_demo: 10
    delta_steps: 50

  text_encoder:
    name: qwen3_vl_4b
    path: playground/Pretrained_models/Qwen3-VL-4B-Instruct
    hidden_size: 2560
    dtype: bf16

  vjepa:
    n_tokens: 256
    hidden_size: 1408

  sampler:
    n_tasks: 32
    n_demos: 8
    seed: 0

framework:
  name: LCLGP
  lclgp:
    d_text: 2560
    d_latent: 1408
    d_hidden: 1024
    n_heads: 16
    n_layers: 4
    n_modes: 4
    n_tokens: 256
    z_dropout: 0.1
    attn_dropout: 0.1
    mlp_ratio: 4.0

    loss:
      alpha: 0.5
      beta: 0.5
      lambda_bal: 0.3
      lambda_ctr: 0.1
      lambda_cf: 0.05
      lambda_rep: 0.03            # v3: 0.1 → v4: 0.03 (1/3.3× peak)
      lambda_rep_warmup_steps: 1200  # v3: 0 (constant) → v4: 1200 (delay turn-on, then linear ramp)
      tau: 0.07
      cf_margin: 0.05
      log_sigma_min: -5.0
      log_sigma_max: 1.5
      bal_temperature: 1.0        # init T at step 0
      bal_temperature_min: 0.3    # v3: 0.1 → v4: 0.3 (softer floor)

trainer:
  max_train_steps: 4800
  num_warmup_steps: 400
  logging_frequency: 20
  save_interval: 800
  num_workers: 4

  learning_rate:
    base: 5.0e-4
  lr_scheduler_type: cosine
  scheduler_specific_kwargs: {}
  optimizer:
    betas: [0.9, 0.999]
    weight_decay: 0.05
    eps: 1.0e-8
  gradient_clipping: 1.0

  loss_scale:
    vla: 1.0

  save_format: pt
  freeze_modules: ""
  pretrained_checkpoint: null
  reload_modules: null
  is_resume: false

seed: 0
is_debug: false
run_root_dir: ./playground/Checkpoints
run_id: pav_w3_lclgp_v4
output_dir: null
wandb_project: pav-w3-lclgp
wandb_entity: null
