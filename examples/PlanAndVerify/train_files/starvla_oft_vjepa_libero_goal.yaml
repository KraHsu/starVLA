# Stage 3 — StarVLA-OFT + offline V-JEPA pooled features on LIBERO-Goal.

run_id: stage3_oft_vjepa_libero_goal
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: ""
wandb_project: starVLA_PAV_Stage3
is_debug: false
version_id: "0.21"

framework:
  name: QwenOFT_VJepa
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-4B-Instruct
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_dim: 7
    state_dim: 7
    action_horizon: 8
  vjepa:
    cache_dir: playground/cache/vjepa/vjepa2_1_vit_b_384/libero_goal
    input_dim: 768
    projector_hidden_dim: 2048
    fusion: film_gating            # film_gating | concat_tokens | cross_attn
    use_film_gating: true          # backward-compatible alias for the default mode
    num_attention_heads: 8
    online_eval_fallback: true     # no episode_id/frame_id in LIBERO sim eval -> run encoder online
    encoder_ckpt_path: null        # null => auto-discover from cache_dir/index.json checkpoint_path
    num_history_frames: 8
    img_size: 384
    dtype: bf16
    primary_camera_index: 0

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_DATA
    data_mix: libero_goal
    action_type: delta_qpos
    sequential_step_sampling: False
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 16
    load_all_data_for_training: true
    video_backend: torchvision_av

trainer:
  max_train_steps: 20000
  num_warmup_steps: 1000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
    vjepa_projector: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ""
  loss_scale:
    vla: 1.0
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 50
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
